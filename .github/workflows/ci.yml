name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push makes the running check pointless: cancel it instead of paying
# for both. The exception is main, whose runs are the record of what shipped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The name of this job is the status check the main branch ruleset requires.
  # Renaming it silently stops that rule from protecting anything.
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # The version Vercel builds this project with.
          bun-version: 1.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run validate

      # `run` matters: `bun test` is Bun's own runner and would ignore the
      # Vitest config that lives in vite.config.ts.
      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
