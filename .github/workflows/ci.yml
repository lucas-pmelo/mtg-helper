name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push makes the running check pointless: cancel it instead of paying
# for both. The exception is main, whose runs are the record of what shipped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The name of this job is the status check the main branch ruleset requires.
  # Renaming it silently stops that rule from protecting anything.
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          # The version Vercel builds this project with.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run validate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
